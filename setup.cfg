[metadata]
name = auth-triage-lab
version = 0.1.0
description = Offline authentication-log triage with line-level evidence and synthetic examples
license = MIT
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = authtriage*

[options.entry_points]
console_scripts =
    authtriage = authtriage.__main__:main
